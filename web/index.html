<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ORBIT — heatmap crypto</title>
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'">
<!-- privacy-first : aucune police distante, aucun tracker, aucune requête tierce -->
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="shell">
  <div id="tint"></div>
  <header>
    <div class="bar1">
      <div class="brand"><span class="dot"></span><h1>Orbit</h1><span class="tag" id="updated">live · coingecko</span></div>
      <div class="macro" id="macro"></div>
      <div class="hbtns">
        <button class="icobtn" id="searchBtn" title="Rechercher dans ma liste">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        </button>
        <button class="pickbtn" id="pickBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Mes cryptos <span class="badge" id="selBadge">0</span></button>
      </div>
    </div>
    <div class="bar2">
      <div class="viewseg" id="viewSeg">
        <button data-v="top" class="on">Top 100</button>
        <button data-v="fav">★ <span id="favCount">0</span></button>
      </div>
      <div class="seg" id="seg">
        <div class="pill"></div>
        <button data-tf="1h">1H</button>
        <button data-tf="24h" class="on">24H</button>
        <button data-tf="7d">7J</button>
        <button data-tf="30d">30J</button>
      </div>
      <div class="chips" id="chips">
        <button class="chip on" data-f="all">Tout</button>
        <button class="chip" data-f="gainers">Hausses</button>
        <button class="chip" data-f="losers">Baisses</button>
        <button class="chip size perf" id="sizeBtn">△ perf</button>
      </div>
      <div class="subline" id="subline"></div>
    </div>
  </header>

  <div id="stage">
    <div id="demoflag">données de démonstration · API indisponible</div>
    <canvas id="map"></canvas>
    <div id="status"><div class="spin"></div>chargement de l'univers (top 1000)…</div>
    <div id="empty"><p>Aucun favori pour l'instant.<br>Ajoute jusqu'à 50 cryptos à suivre.</p><button id="emptyPick">+ Choisir mes favoris</button></div>
    <div class="legend"><span>baisse</span><div class="bar"></div><span>hausse</span></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>

<div class="over" id="picker"><div class="card">
  <div class="hd"><h3>Mes cryptos</h3><button class="done" id="pickDone">Terminé</button></div>
  <div class="sb"><input id="pickInput" placeholder="rechercher dans le top 1000…" autocomplete="off" spellcheck="false"></div>
  <div class="meta"><span id="pickCount">0 sélectionnées</span><span id="pickUniv">univers : —</span></div>
  <div class="pickctl">
    <button class="favtog" id="favTog"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6L12 17l-5.3 2.6 1.1-6L3.4 9.4l6-.8z"/></svg> favoris</button>
    <div class="pager" id="pickPager"></div>
  </div>
  <div class="list" id="pickList"></div>
</div></div>

<div class="over" id="search"><div class="card">
  <div class="hd"><h3>Aller à</h3><button class="done" id="searchDone">Fermer</button></div>
  <div class="sb"><input id="searchInput" placeholder="dans ma liste…" autocomplete="off" spellcheck="false"></div>
  <div class="list" id="searchList"></div>
</div></div>

<script src="app.js" defer></script>
</body>
</html>
