# orbit.l0g.fr — static front + snapshot JSON + locally-cached logos.
# Modules: ssl headers rewrite  (a2enmod ssl headers rewrite)
# Snapshot architecture: the browser only ever reads same-origin static files.

<VirtualHost *:80>
    ServerName orbit.l0g.fr
    DocumentRoot /var/www/html/orbit
    RewriteEngine On
    # ACME challenge passes through, everything else upgrades to HTTPS
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=308,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName orbit.l0g.fr
    DocumentRoot /var/www/html/orbit

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/orbit.l0g.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/orbit.l0g.fr/privkey.pem

    # --- privacy: anonymise client IP in logs ---
    LogFormat "%{X-Anon-IP}e %t \"%r\" %>s %b" anon
    SetEnvIf Remote_Addr "^(\d+\.\d+\.\d+)\.\d+$" X-Anon-IP=$1.0
    CustomLog /var/log/apache2/orbit-access.log anon
    ErrorLog  /var/log/apache2/orbit-error.log

    # --- security headers ---
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "interest-cohort=(), geolocation=(), microphone=(), camera=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set X-Permitted-Cross-Domain-Policies "none"
    Header always set Origin-Agent-Cluster "?1"
    # Strict CSP: no third party possible. script-src 'self' (external app.js),
    # style-src 'self' (external app.css; all dynamic styling done via CSSOM, no inline).
    Header always set Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'; worker-src 'none'; frame-src 'none'; manifest-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"

    # --- snapshot data (written by the builder, outside the web root) ---
    # Apache 2.4 denies filesystem access by default; the aliased path needs an
    # explicit grant or /data.json returns 403. Options None + no dir alias means
    # only /data.json and /logos/* are reachable (no listing, no sibling files).
    <Directory /var/lib/orbit>
        Require all granted
        Options None
        AllowOverride None
    </Directory>
    Alias /data.json /var/lib/orbit/orbit.json
    <Location "/data.json">
        Header set Cache-Control "public, max-age=20, stale-while-revalidate=120, stale-if-error=600"
    </Location>
    Alias /logos /var/lib/orbit/logos
    <Directory /var/lib/orbit/logos>
        Require all granted
        Options None
        Header set Cache-Control "public, max-age=2592000, immutable"
    </Directory>

    # --- static front ---
    RedirectMatch 301 ^/(rgpd|mentions-legales|mentions-legales\.html)$ /legal/

    <Directory /var/www/html/orbit>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
    </Directory>
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <FilesMatch "\.(css|js|svg)$">
        Header set Cache-Control "public, max-age=300"
    </FilesMatch>

    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json
</VirtualHost>
